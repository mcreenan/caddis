# Installers: `npm run dist` (current OS), `npm run dist:linux`, `npm run dist:mac`. Output goes to dist/.
appId: dev.mcreenan.caddis
productName: Caddis
copyright: Copyright © 2026 Matt Creenan
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # Served raw to the canvas frame at runtime (with d3/three/idiomorph from node_modules).
  - src/canvas/**
  # Caddis drives the user's installed `claude` CLI, so skip the SDK's ~250 MB bundled binary.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # Not loaded at runtime: TypeScript sources, typings, source maps, the SDK's browser build.
  - "!**/node_modules/three/src/**"
  - "!**/node_modules/zod/src/**"
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk/browser-sdk.js"
  - "!**/*.{map,d.ts,d.cts,d.mts}"
# Keeps three/examples (the canvas's `three/addons/...`), which electron-builder skips by default.
onNodeModuleFile: ./scripts/builder-hooks.mjs
# Chromium's UI strings; the app's own UI is English-only.
electronLanguages: [en-US]
compression: maximum
fileAssociations:
  - ext: caddis
    name: Caddis artifact
    description: Caddis artifact
    mimeType: application/x-caddis
    role: Editor
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Matt Creenan <mattcreenan@gmail.com>
  synopsis: A malleable canvas built live by a coding agent
mac:
  target: [dmg]
  category: public.app-category.developer-tools
  # Unsigned until a Developer ID certificate is set up.
  identity: null
dmg:
  writeUpdateInfo: false
publish: null
