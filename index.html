<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Canvas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%237c9cff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <!-- Layer 0: the sandboxed canvas iframe(s) -->
    <div id="stage"></div>

    <!-- Layer 1: agent-styleable chrome (z-index above anything the canvas can paint) -->
    <div id="chrome">
      <form id="start" class="start" hidden>
        <div class="start-title">Agent Canvas</div>
        <textarea id="start-input" rows="3" placeholder="What should we build on the canvas?" autofocus></textarea>
        <div class="start-opts">
          <label>Provider <select id="opt-provider"></select></label>
          <label>Model <input id="opt-model" list="model-list" placeholder="default" spellcheck="false" /></label>
          <datalist id="model-list"></datalist>
          <label>Effort <select id="opt-effort"></select></label>
          <label class="wide">Directory <input id="opt-cwd" spellcheck="false" /></label>
        </div>
        <div class="start-foot">
          <span id="start-err" class="err"></span>
          <button type="submit" class="btn primary">Start ↵</button>
        </div>
      </form>

      <div id="history" class="chrome-box chrome-history" hidden>
        <header>
          <span class="dot"></span>
          <span class="h-title">Session</span>
          <span class="h-status"></span>
          <button class="icon" id="history-mini" title="Minimise">–</button>
        </header>
        <div class="h-items"></div>
      </div>
      <button id="mini" class="chrome-mini" hidden title="Show session history"><span class="dot"></span></button>

      <form id="prompt" class="chrome-box chrome-prompt" hidden>
        <textarea rows="1" placeholder="Message the canvas…"></textarea>
        <button type="button" class="icon stop" title="Stop" hidden>■</button>
        <button type="submit" class="icon send" title="Send">↑</button>
      </form>
    </div>

    <!-- Layer 2: immutable escape hatch -->
    <button id="safe-toggle" class="safe-toggle" title="Safe mode (Ctrl/Cmd+Shift+Esc)">◐</button>
    <div id="safe" class="safe" hidden>
      <div class="safe-bar">
        <strong>Safe mode</strong>
        <span class="muted">base controls · agent styling ignored</span>
        <span class="spacer"></span>
        <button class="btn" data-act="chrome.reset">Reset chrome</button>
        <button class="btn" data-act="chrome.undo">Undo chrome <span data-count="chromeUndo"></span></button>
        <button class="btn" data-act="canvas.undo">Undo canvas <span data-count="canvasUndo"></span></button>
        <button class="btn" data-act="canvas.redo">Redo canvas <span data-count="canvasRedo"></span></button>
        <button class="btn" data-act="canvas.clear">Clear canvas</button>
        <button class="btn" data-act="hide-canvas">Hide canvas</button>
        <a class="btn" href="/" target="_blank">New session</a>
        <button class="btn primary" data-act="close">Close (Esc)</button>
      </div>
      <div class="safe-body">
        <div class="safe-history"></div>
        <form class="safe-prompt">
          <textarea rows="2" placeholder="Message (base prompt)…"></textarea>
          <button class="btn primary" type="submit">Send</button>
          <button class="btn" type="button" data-act="interrupt">Stop</button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
