name: Build

# Checks every PR and push; each merge to main also replaces the rolling `nightly` prerelease.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp test run
      # Nightlies are prereleases of the next patch, e.g. 0.2.1-nightly.42 after 0.2.0.
      - id: version
        run: |
          echo "version=$(node -p '
            const [major, minor, patch] = require("./package.json").version.split(".").map(Number);
            `${major}.${minor}.${patch + 1}-nightly.${process.env.GITHUB_RUN_NUMBER}`
          ')" >> "$GITHUB_OUTPUT"

  package:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.check.outputs.version }}

  nightly:
    needs: [check, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly installers/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Nightly ($VERSION)" \
            --notes "Built from $GITHUB_SHA on main. Replaced on every merge; use the latest stable release unless you need something unreleased. The macOS build is not notarized; see the README to open it."
